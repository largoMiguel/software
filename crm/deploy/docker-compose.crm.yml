name: softone-crm

services:
  crm-db:
    image: postgres:17-alpine
    container_name: softone-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /srv/postgres/crm:/var/lib/postgresql/data
    networks:
      - crm_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true

  crm-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: softone-crm-backend:latest
    container_name: softone-crm-backend
    restart: unless-stopped
    depends_on:
      crm-db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ALLOW_API_DOCS: ${ALLOW_API_DOCS:-false}
      ENABLE_DJANGO_ADMIN: ${ENABLE_DJANGO_ADMIN:-false}
      POSTGRES_HOST: crm-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-https://crm.softone360.com}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      INITIAL_PLATFORM_ADMIN_EMAIL: ${INITIAL_PLATFORM_ADMIN_EMAIL:-}
      INITIAL_PLATFORM_ADMIN_NAME: ${INITIAL_PLATFORM_ADMIN_NAME:-Admin CRM}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://crm.softone360.com}
      USE_B2_STORAGE: ${USE_B2_STORAGE:-false}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET_CRM: ${B2_BUCKET_CRM:-crm-softone}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
    volumes:
      - crm_media:/app/media
      - crm_static:/app/staticfiles
    networks:
      - crm_internal
      - edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 768M
    security_opt:
      - no-new-privileges:true

  crm-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    image: softone-crm-frontend:latest
    container_name: softone-crm-frontend
    restart: unless-stopped
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

  crm-nginx:
    image: nginx:1.27-alpine
    container_name: softone-crm-nginx
    restart: unless-stopped
    depends_on:
      crm-backend:
        condition: service_healthy
      crm-frontend:
        condition: service_started
    ports:
      - "${LAN_HTTP_PORT:-8082}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - crm_static:/var/www/static:ro
      - crm_media:/var/www/media:ro
    networks:
      edge:
        aliases:
          - softone-crm-nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

networks:
  crm_internal:
    driver: bridge
    internal: true
  edge:
    external: true
    name: softone_edge

volumes:
  crm_media:
  crm_static:
