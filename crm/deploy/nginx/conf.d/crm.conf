upstream crm_backend_upstream {
    server softone-crm-backend:8000;
    keepalive 32;
}

upstream crm_frontend_upstream {
    server softone-crm-frontend:80;
    keepalive 16;
}

map $sent_http_content_type $crm_csp_header {
    default "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://clerk.crm.softone360.com https://*.clerk.accounts.dev https://cdn.protect.clerk.com https://challenges.cloudflare.com https://static.cloudflareinsights.com; script-src-attr 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://clerk.crm.softone360.com https://api.clerk.com https://*.clerk.accounts.dev https://cdn.protect.clerk.com https://cloudflareinsights.com; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com https://clerk.crm.softone360.com https://accounts.crm.softone360.com https://*.clerk.accounts.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
}

server {
    listen 80 default_server;
    server_name _;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $crm_csp_header always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    location = /favicon.ico {
        proxy_pass http://crm_frontend_upstream/favicon.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        proxy_pass http://crm_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location = /api/v1/webhooks/clerk {
        proxy_pass http://crm_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://crm_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    location / {
        proxy_pass http://crm_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
